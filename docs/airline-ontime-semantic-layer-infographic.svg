<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f5f8fb"/><style>text{font-family:Arial,sans-serif;fill:#142c49}.h{font-size:52px;font-weight:bold}.sub{font-size:24px}.head{font-size:30px;font-weight:bold}.body{font-size:23px}.small{font-size:20px}.card{fill:white;stroke:#d6e2ed;stroke-width:2}.blue{fill:#e3f1fa}.green{fill:#e4f5f1}.purple{fill:#f0e9fa}.arrow{stroke:#17648a;stroke-width:5;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#17648a"/></marker></defs><text x="65" y="90" class="h">Airline On-Time Semantic Layer</text><text x="65" y="132" class="sub">One governed definition. One GraphQL API. Consistent performance insights.</text><rect class="card" x="45" y="185" width="375" height="510" rx="20"/><text x="75" y="235" class="head">Business challenge</text><text x="75" y="298" class="body">Fragmented flight and</text><text x="75" y="333" class="body">route data</text><text x="75" y="405" class="body">Inconsistent on-time</text><text x="75" y="440" class="body">KPI definitions</text><text x="75" y="512" class="body">Repeated integrations</text><text x="75" y="584" class="body">Slower analytics delivery</text><rect class="card" x="450" y="185" width="725" height="510" rx="20"/><text x="480" y="235" class="head">AWS technical solution</text><rect class="blue" x="480" y="315" width="175" height="145" rx="15"/><text x="502" y="369" class="body">Dashboards</text><text x="507" y="406" class="small">and apps</text><path class="arrow" d="M660 385 H714"/><rect class="purple" x="722" y="315" width="195" height="145" rx="15"/><text x="748" y="371" class="body">AWS AppSync</text><text x="756" y="407" class="small">GraphQL API</text><path class="arrow" d="M919 385 H968"/><rect class="green" x="973" y="315" width="173" height="145" rx="15"/><text x="990" y="370" class="body">AWS Lambda</text><text x="998" y="406" class="small">Metric logic</text><rect class="blue" x="545" y="520" width="225" height="110" rx="14"/><text x="568" y="566" class="body">DynamoDB</text><text x="569" y="600" class="small">10 route records</text><rect class="green" x="875" y="520" width="235" height="110" rx="14"/><text x="904" y="566" class="body">Amazon S3</text><text x="891" y="600" class="small">~4,300 flights</text><path class="arrow" d="M815 463 V487 H658 V515"/><path class="arrow" d="M1055 463 V515"/><rect class="card" x="1205" y="185" width="350" height="510" rx="20"/><text x="1235" y="235" class="head">Governed metrics</text><text x="1235" y="303" class="body">On-time percentage</text><text x="1235" y="369" class="body">Cancellation rate</text><text x="1235" y="435" class="body">Average arrival delay</text><text x="1235" y="501" class="body">Median arrival delay</text><text x="1235" y="567" class="body">P90 arrival delay</text><text x="1235" y="633" class="small">Threshold: 1–180 min</text><rect x="45" y="725" width="1510" height="105" rx="18" fill="#dff1ed"/><text x="75" y="767" class="head">Business value</text><text x="75" y="807" class="body">Consistent KPIs    •    Reusable API    •    Flexible thresholds    •    Simpler integrations    •    Faster insights</text><text x="60" y="872" class="small">AWS CDK deployment  |  Synthetic BTS-shaped data  |  Demo, not production airline performance</text></svg>